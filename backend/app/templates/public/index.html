<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>{{ meta.nom if meta else "Swimrun de Saint-Pabu" }} — Parcours</title>
  <meta name="description" content="Repérez le parcours du {{ meta.nom if meta else 'Swimrun de Saint-Pabu' }} : tracé, ravitaillements, marée.">

  <meta property="og:title" content="{{ meta.nom if meta else 'Swimrun de Saint-Pabu' }}">
  <meta property="og:description" content="Parcours interactif{{ ' — ' + meta.date if meta and meta.date else '' }}.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ url_for('static', filename='img/favicon.jpg', _external=True) }}">

  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/favicon.jpg') }}">

  <link rel="stylesheet" href="{{ theme_css_href() }}">
  {% set asset = vite_asset('public') %}
  {% for href in asset.css_hrefs %}
  <link rel="stylesheet" href="{{ href }}">
  {% endfor %}
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; background: var(--couleur-fond); color: var(--couleur-texte); }
  </style>
</head>
<body data-theme="plage">
  <div id="app"></div>
  {% if asset.dev %}
  <script type="module" src="{{ asset.client_src }}"></script>
  {% endif %}
  <script type="module" src="{{ asset.script_src }}"></script>
</body>
</html>
